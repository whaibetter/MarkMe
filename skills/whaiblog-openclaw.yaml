name: whaiblog-blog-manager
version: 2.2.0
description: WhaiBlog 博客系统管理工具 - 支持文章、信息流、RSS 订阅和文件的完整 CRUD 操作
author: WhaiBlog

instructions: |
  这是 WhaiBlog 博客系统的管理工具。
  你可以通过这些工具管理博客文章、信息流、RSS 订阅源和上传的文件。
  所有数据管理都通过此工具进行，前端页面仅用于展示。

  【重要】首次使用前必须先配置服务器地址：
  1. 调用 get_whaiblog_config 检查是否已配置
  2. 如果 configured=false，询问用户 WhaiBlog 服务器地址，然后调用 set_whaiblog_config 保存
  3. 配置完成后才能使用其他工具

  【RSS 安全】RSS 写操作（添加/删除/抓取）需要 API Key。如果服务器配置了 API_KEY，调用这些工具时必须传入 api_key 参数。

  配置文件保存在 ~/.whaiblog/config.json，所有 WhaiBlog 工具共享此配置。

tools:
  # 配置管理
  - name: get_whaiblog_config
    description: 获取 WhaiBlog 客户端配置。首次使用前必须先调用此工具检查。
    parameters:
      type: object
      properties: {}

  - name: set_whaiblog_config
    description: 设置 WhaiBlog 客户端配置（服务器地址和可选 API Key）
    parameters:
      type: object
      properties:
        server_url:
          type: string
          description: WhaiBlog 服务器地址，如 http://117.72.196.45:8080
        api_key:
          type: string
          description: API Key（可选）
      required:
        - server_url

  # 文章管理
  - name: create_post
    description: 创建新的博客文章
    parameters:
      type: object
      properties:
        title:
          type: string
          description: 文章标题
        content:
          type: string
          description: 文章内容 (Markdown 格式)
        summary:
          type: string
          description: 文章摘要
        tags:
          type: array
          items:
            type: string
          description: 文章标签列表
        status:
          type: string
          enum: [published, draft]
          description: 文章状态
      required:
        - title
        - content

  - name: update_post
    description: 更新现有的博客文章
    parameters:
      type: object
      properties:
        id:
          type: number
          description: 文章 ID
        title:
          type: string
          description: 新标题
        content:
          type: string
          description: 新内容
        summary:
          type: string
          description: 新摘要
        tags:
          type: array
          items:
            type: string
          description: 新标签列表
        status:
          type: string
          enum: [published, draft]
          description: 新状态
      required:
        - id

  - name: delete_post
    description: 删除博客文章
    parameters:
      type: object
      properties:
        id:
          type: number
          description: 文章 ID
      required:
        - id

  - name: list_posts
    description: 列出所有博客文章
    parameters:
      type: object
      properties:
        page:
          type: number
          description: 页码
        limit:
          type: number
          description: 每页数量
        status:
          type: string
          enum: [published, draft, all]
          description: 筛选状态

  - name: get_post
    description: 获取特定博客文章详情
    parameters:
      type: object
      properties:
        id:
          type: number
          description: 文章 ID
      required:
        - id

  # 信息流管理
  - name: create_feed
    description: 创建新的信息流条目
    parameters:
      type: object
      properties:
        title:
          type: string
          description: 标题
        content:
          type: string
          description: 内容
        summary:
          type: string
          description: 摘要
        source:
          type: string
          description: 来源（如网站名、作者）
        url:
          type: string
          description: 原文链接
        tags:
          type: array
          items:
            type: string
          description: 标签列表
        format:
          type: string
          enum: [markdown, html, text]
          description: "内容格式：markdown（默认）、html 或 text"
      required:
        - title
        - content

  - name: list_feeds
    description: 列出所有信息流条目
    parameters:
      type: object
      properties:
        page:
          type: number
          description: 页码
        limit:
          type: number
          description: 每页数量

  - name: get_feed
    description: 获取特定信息流条目详情
    parameters:
      type: object
      properties:
        id:
          type: number
          description: Feed ID
      required:
        - id

  - name: update_feed
    description: 更新信息流条目
    parameters:
      type: object
      properties:
        id:
          type: number
          description: Feed ID
        title:
          type: string
          description: 新标题
        content:
          type: string
          description: 新内容
        summary:
          type: string
          description: 新摘要
        source:
          type: string
          description: 新来源
        url:
          type: string
          description: 新链接
        tags:
          type: array
          items:
            type: string
          description: 新标签列表
        format:
          type: string
          enum: [markdown, html, text]
          description: 内容格式
        status:
          type: string
          enum: [published, draft]
          description: 新状态
      required:
        - id

  - name: delete_feed
    description: 删除信息流条目
    parameters:
      type: object
      properties:
        id:
          type: number
          description: Feed ID
      required:
        - id

  # 文件管理
  - name: upload_file
    description: 上传单个文件到博客系统
    parameters:
      type: object
      properties:
        file_path:
          type: string
          description: 文件的绝对路径
        post_id:
          type: number
          description: 关联的文章 ID (可选)
      required:
        - file_path

  - name: upload_folder
    description: 上传整个文件夹到博客系统
    parameters:
      type: object
      properties:
        folder_path:
          type: string
          description: 文件夹的绝对路径
        post_id:
          type: number
          description: 关联的文章 ID (可选)
      required:
        - folder_path

  - name: list_files
    description: 列出所有已上传的文件
    parameters:
      type: object
      properties: {}

  - name: get_file
    description: 获取文件详情
    parameters:
      type: object
      properties:
        id:
          type: number
          description: 文件 ID
      required:
        - id

  - name: update_file
    description: 更新文件元数据（名称、关联文章）
    parameters:
      type: object
      properties:
        id:
          type: number
          description: 文件 ID
        original_name:
          type: string
          description: 新的显示名称
        post_id:
          type: number
          description: 关联的文章 ID (null 取消关联)
      required:
        - id

  - name: replace_file
    description: 替换文件内容（服务器本地文件）
    parameters:
      type: object
      properties:
        id:
          type: number
          description: 文件 ID
        file_path:
          type: string
          description: 新文件的路径
      required:
        - id
        - file_path

  - name: upload_content
    description: 通过 base64 内容上传文件（用于远程客户端）
    parameters:
      type: object
      properties:
        filename:
          type: string
          description: 文件名（含扩展名）
        content:
          type: string
          description: 文件内容的 base64 编码
        post_id:
          type: number
          description: 关联的文章 ID (可选)
      required:
        - filename
        - content

  - name: replace_file_content
    description: 通过 base64 内容替换文件（用于远程客户端）
    parameters:
      type: object
      properties:
        id:
          type: number
          description: 文件 ID
        content:
          type: string
          description: 新文件内容的 base64 编码
      required:
        - id
        - content

  - name: delete_file
    description: 删除已上传的文件
    parameters:
      type: object
      properties:
        id:
          type: number
          description: 文件 ID
      required:
        - id

  # 统计
  - name: get_stats
    description: 获取博客统计数据
    parameters:
      type: object
      properties: {}

  # 系统监控
  - name: get_system_info
    description: 获取 WhaiBlog 应用的系统资源使用情况（CPU、内存、磁盘、运行时间）
    parameters:
      type: object
      properties: {}

  # 学习笔记（只读）
  - name: list_notes
    description: 列出学习笔记仓库的目录树（只读）
    parameters:
      type: object
      properties:
        path:
          type: string
          description: 仓库内相对路径，默认根目录
        depth:
          type: number
          description: 树深度，默认 2

  - name: get_note
    description: 获取指定笔记文件的内容（只读）
    parameters:
      type: object
      properties:
        path:
          type: string
          description: 文件的相对路径
      required:
        - path

  - name: notes_status
    description: 获取笔记仓库同步状态（克隆中/就绪/错误）
    parameters:
      type: object
      properties: {}

  - name: add_rss_source
    description: 添加外部 RSS 订阅源（需要 API Key）
    parameters:
      type: object
      properties:
        url:
          type: string
          description: RSS 订阅源 URL
        title:
          type: string
          description: 显示名称（可选）
      required:
        - url

  - name: list_rss_sources
    description: 列出所有 RSS 订阅源（只读）
    parameters:
      type: object
      properties: {}

  - name: remove_rss_source
    description: 删除 RSS 订阅源（需要 API Key）
    parameters:
      type: object
      properties:
        id:
          type: number
          description: 订阅源 ID
      required:
        - id

  - name: fetch_rss
    description: 从 RSS 源抓取新内容（需要 API Key）
    parameters:
      type: object
      properties:
        id:
          type: number
          description: 订阅源 ID（省略则抓取全部）

  - name: get_rss_status
    description: 获取 RSS 系统状态（只读）
    parameters:
      type: object
      properties: {}
