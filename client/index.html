<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wenhai's Blog</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- CSS Modules -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/post-card.css">
  <link rel="stylesheet" href="css/post-detail.css">
  <link rel="stylesheet" href="css/toc.css">
  <link rel="stylesheet" href="css/tags.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/notes.css">
  <link rel="stylesheet" href="css/feed.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script>
    (function() {
      var t = localStorage.getItem('markme-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      },
      startup: {
        typeset: false
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
  <!-- Noise texture overlay -->
  <div class="noise-bg"></div>

  <!-- Reading progress bar -->
  <div class="reading-progress" id="reading-progress"></div>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-left">
        <h1 class="logo"><a href="/">Wenhai's Blog</a></h1>
      </div>
      <nav class="nav">
        <a href="/" data-section="feed" data-link class="active">Feed</a>
        <a href="/?section=blogs" data-section="blogs" data-link>Blogs</a>
        <a href="/?section=notes" data-section="notes" data-link>Notes</a>
        <a href="/?section=about" data-section="about" data-link>About</a>
        <div class="nav-controls">
          <button class="lang-toggle" aria-label="Toggle language">
            <span class="lang-label">EN</span>
          </button>
          <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.04-.23-.29-.38-.63-.38-1.01 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-5.5-4.5-9.95-10-9.95z"/></svg>
            <span class="theme-label">Dark</span>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main class="main container">
    <div id="app">
      <div class="loading">
        <div class="loading-ring"></div>
        <span>Loading</span>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-divider"></div>
      <p>Wenhai &copy; 2026</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="marked.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
